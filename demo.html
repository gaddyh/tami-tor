<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Driftless — You don’t forget. You finish.</title>
  <style>
    html,body{
      height:100%;
      margin:0;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0f14;
      color:#e8eef7;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .box{
      text-align:left;
      max-width:640px;
      padding:24px;
    }
    h1{
      font-size:56px;
      line-height:1.05;
      margin:0 0 28px;
      font-weight:700;
    }
    button{
      padding:14px 22px;
      border-radius:12px;
      border:none;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      background:#7c5cff;
      color:#0b0f14;
    }
    button:hover{
      filter:brightness(1.05);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>
      Finished. <br/>
    </h1>
    <h3>
      No loose ends.
    </h3>
    <button>Get early access</button>
  </div>
</body>
</html>
