[project]
name = "tami"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "alembic (>=1.18.1,<2.0.0)",
    "psycopg (>=3.3.2,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "google-auth-oauthlib (>=1.2.4,<2.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "google-api-python-client (>=2.188.0,<3.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "google-auth (>=2.48.0,<3.0.0)",
    "langfuse (>=3.12.1,<4.0.0)",
    "google-cloud-speech (>=2.36.0,<3.0.0)",
    "ffmpeg-python (>=0.2.0,<0.3.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ipython (>=9.9.0,<10.0.0)"
]
